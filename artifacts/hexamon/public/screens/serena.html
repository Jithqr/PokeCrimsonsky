<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CANTHERELLA — Pokémon Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #FFD700; --gold2: #FFA500;
    --blue: #4FC3F7; --accent: #7C4DFF;
    --dark: #08080F;
    --glass-bg: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
  }
  html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:none; background:transparent; font-family:'Rajdhani',sans-serif; }
  #sky { position:fixed; inset:0; z-index:0; }

  #sky-overlay {
    position:fixed; inset:0 0 115px 0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse 55% 35% at 32% 35%, rgba(88,28,135,0.28) 0%, transparent 65%),
      radial-gradient(ellipse 50% 30% at 68% 38%, rgba(109,40,217,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 65% 30% at 50% 25%, rgba(139,92,246,0.20) 0%, transparent 65%),
      radial-gradient(ellipse 70% 50% at 50% 50%, rgba(20,10,60,0.35) 0%, transparent 70%),
      linear-gradient(to bottom, rgba(5,5,15,0.5) 0%, rgba(5,5,15,0.05) 50%, rgba(5,5,15,0.6) 100%);
  }

  .grid-floor {
    position:fixed; bottom:0; left:0; right:0; height:38%;
    background-image:
      linear-gradient(rgba(79,195,247,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,195,247,0.08) 1px, transparent 1px);
    background-size:55px 55px;
    transform:perspective(600px) rotateX(58deg);
    transform-origin:bottom center;
    animation:gridPulse 4s ease-in-out infinite;
    z-index:2;
  }
  @keyframes gridPulse { 0%,100%{opacity:0.4} 50%{opacity:0.7} }

  .floor-glow {
    position:fixed; bottom:-8%; left:50%; transform:translateX(-50%);
    width:min(500px, 90vw); height:min(160px, 22vw);
    background:radial-gradient(ellipse, rgba(79,195,247,0.2) 0%, transparent 70%);
    z-index:2; animation:floorGlow 3s ease-in-out infinite;
  }
  @keyframes floorGlow {
    0%,100%{opacity:0.5;transform:translateX(-50%) scaleX(1)}
    50%{opacity:0.9;transform:translateX(-50%) scaleX(1.08)}
  }

  .particles { position:fixed; inset:0; pointer-events:none; z-index:3; }
  .particle { position:absolute; border-radius:50%; animation:floatUp linear infinite; opacity:0; }
  @keyframes floatUp {
    0%{transform:translateY(0) scale(0);opacity:0}
    10%{opacity:0.7} 90%{opacity:0.2}
    100%{transform:translateY(-100dvh) scale(0.4);opacity:0}
  }

  .pokeball-watermark {
    position:fixed; left:50%; top:42%; transform:translate(-50%,-50%);
    width:min(680px, 90vw); height:min(680px, 90vw); z-index:1; pointer-events:none;
    animation:rotateSlow 24s linear infinite;
    will-change:transform;
  }
  .pokeball-watermark img { width:100%; height:100%; object-fit:contain; opacity:0.22; filter:grayscale(1); }
  @keyframes rotateSlow {
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
  }

  .corner { position:fixed; width:28px; height:28px; z-index:80; }
  .corner::before,.corner::after { content:''; position:absolute; background:rgba(255,215,0,0.55); }
  .corner::before { width:100%; height:1.5px; top:0; }
  .corner::after  { width:1.5px; height:100%; left:0; }
  .corner-tl{top:14px;left:14px}
  .corner-tr{top:14px;right:14px;transform:scaleX(-1)}
  .corner-bl{bottom:64px;left:14px;transform:scaleY(-1)}
  .corner-br{bottom:64px;right:14px;transform:scale(-1)}

  .top-ui {
    position:fixed; top:0; left:0; right:0;
    padding:clamp(16px,4dvh,26px) clamp(16px,6vw,32px) 0;
    display:flex; justify-content:space-between; align-items:flex-start;
    z-index:50;
  }
  .player-label { font-size:10px; font-weight:700; letter-spacing:4px; color:rgba(255,255,255,0.3); text-transform:uppercase; }
  .player-name {
    font-family:'Bebas Neue',sans-serif; font-size:clamp(36px, 13vw, 56px); line-height:0.88;
    color:#fff; letter-spacing:3px;
    animation:nameGlow 3s ease-in-out infinite, fadeInLeft 0.6s ease-out 0.1s both;
  }
  @keyframes nameGlow {
    0%,100%{text-shadow:0 0 28px rgba(255,215,0,0.45),0 0 55px rgba(79,195,247,0.15)}
    50%{text-shadow:0 0 45px rgba(255,215,0,0.75),0 0 80px rgba(79,195,247,0.3)}
  }
  @keyframes fadeInLeft { from{transform:translateX(-24px);opacity:0} to{transform:translateX(0);opacity:1} }
  .player-title { font-size:12px; font-weight:700; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; margin-top:3px; }
  .rank-stars { display:flex; gap:3px; margin-top:6px; }
  .star { color:var(--gold); font-size:13px; animation:starTwinkle 2.2s ease-in-out infinite; }
  .star:nth-child(2){animation-delay:0.25s}.star:nth-child(3){animation-delay:0.5s}
  .star:nth-child(4){animation-delay:0.75s}.star:nth-child(5){animation-delay:1s}
  @keyframes starTwinkle { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .dex-id { text-align:right; }
  .dex-label { font-size:9px; letter-spacing:3px; color:rgba(255,255,255,0.2); text-transform:uppercase; }
  .dex-num { font-family:'Bebas Neue',sans-serif; font-size:36px; color:rgba(255,255,255,0.07); letter-spacing:2px; line-height:1; }

  .region-tag {
    position:fixed; top:50%; right:24px;
    transform:translateY(-50%) rotate(90deg);
    font-size:9px; letter-spacing:5px; color:rgba(255,255,255,0.1);
    text-transform:uppercase; white-space:nowrap; z-index:10;
  }

  .screen { position:relative; width:100%; height:100vh; height:100dvh; display:flex; align-items:center; justify-content:center; z-index:10; }

  .party-layout {
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%;
    padding:20px 8px 80px; gap:0; margin-top:-40px;
  }

  .slots-col { display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:center; flex-shrink:0; z-index:15; }
  .slots-col.left  { margin-right:-16px; }
  .slots-col.right { margin-left:-16px; }

  .poke-card {
    position:relative; width:122px; height:108px; border-radius:18px;
    background:linear-gradient(135deg,rgba(255,255,255,0.11) 0%,rgba(20,15,50,0.78) 60%,rgba(30,60,100,0.68) 100%);
    border:1px solid rgba(255,255,255,0.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer;
    transition:transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s, border-color 0.22s;
    animation:cardEntry 0.6s cubic-bezier(.34,1.56,.64,1) both, typeGlow 3s ease-in-out infinite;
    will-change:transform;
  }
  .slots-col.left  .poke-card:nth-child(1){animation-delay:0.1s,0s}
  .slots-col.left  .poke-card:nth-child(2){animation-delay:0.2s,0s}
  .slots-col.left  .poke-card:nth-child(3){animation-delay:0.3s,0s}
  .slots-col.right .poke-card:nth-child(1){animation-delay:0.15s,0s}
  .slots-col.right .poke-card:nth-child(2){animation-delay:0.25s,0s}
  .slots-col.right .poke-card:nth-child(3){animation-delay:0.35s,0s}
  @keyframes cardEntry { from{transform:scale(0.7) translateY(10px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }

  .poke-card:hover {
    transform:scale(1.1) translateY(-4px);
    border-color:rgba(79,195,247,0.55);
    box-shadow:0 10px 32px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.25),0 0 22px rgba(79,195,247,0.35);
  }
  .poke-card::before {
    content:''; position:absolute; top:0; left:-70%; width:45%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
    transform:skewX(-15deg); transition:left 0.55s ease; pointer-events:none;
  }
  .poke-card:hover::before { left:130%; }
  .poke-card::after {
    content:''; position:absolute; top:0; left:12%; right:12%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent); border-radius:50%;
  }
  .poke-card img { height:64px; width:auto; image-rendering:pixelated; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.65)); margin-bottom:3px; }
  .poke-name { font-size:8px; font-weight:700; letter-spacing:1.5px; color:rgba(255,255,255,0.5); text-transform:uppercase; pointer-events:none; }

  .poke-card.type-dragon { --card-glow:rgba(100,80,255,0.22); }
  .poke-card.type-fire   { --card-glow:rgba(255,170,40,0.20); }
  .poke-card.type-water  { --card-glow:rgba(60,180,255,0.20); }
  .poke-card.type-psychic{ --card-glow:rgba(200,80,220,0.20); }
  .poke-card.type-ghost  { --card-glow:rgba(120,80,180,0.22); }
  .poke-card.type-steel  { --card-glow:rgba(160,180,200,0.20); }
  @keyframes typeGlow {
    0%,100%{box-shadow:0 4px 20px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.18)}
    50%{box-shadow:0 4px 28px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.18),0 0 14px var(--card-glow,rgba(79,195,247,0.15))}
  }

  .trainer-wrap {
    position:relative; z-index:20; flex-shrink:0;
    display:flex; align-items:flex-end; justify-content:center;
    width:clamp(190px,36vw,310px); height:100%;
  }
  .trainer-glow {
    position:absolute; bottom:6%; left:50%; transform:translateX(-50%);
    width:200px; height:20px;
    background:radial-gradient(ellipse,rgba(79,195,247,0.4) 0%,transparent 70%);
    border-radius:50%; animation:groundGlow 2.5s ease-in-out infinite;
  }
  @keyframes groundGlow {
    0%,100%{transform:translateX(-50%) scaleX(1);opacity:0.5}
    50%{transform:translateX(-50%) scaleX(0.85);opacity:0.95}
  }
  .ring {
    position:absolute; bottom:7%; left:50%; transform:translateX(-50%);
    width:160px; height:22px; border:1px solid rgba(79,195,247,0.35); border-radius:50%;
    animation:ringExpand 2.2s ease-out infinite;
  }
  .ring:nth-child(2){animation-delay:0.75s} .ring:nth-child(3){animation-delay:1.5s}
  @keyframes ringExpand {
    0%{transform:translateX(-50%) scale(0.5);opacity:0.8}
    100%{transform:translateX(-50%) scale(2.6);opacity:0}
  }
  .trainer-img {
    height:clamp(260px,65dvh,560px); width:auto; object-fit:contain;
    display:block; position:relative; z-index:2;
    filter:drop-shadow(0 0 36px rgba(79,195,247,0.18)) drop-shadow(0 16px 40px rgba(0,0,0,0.85));
  }

  /* Material Symbols base style */
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    font-size:26px; line-height:1; display:block;
    color:rgba(255,255,255,0.65);
    transition: color 0.2s;
  }
  .nav-btn.active .material-symbols-outlined { color:#b39dff; }
  .nav-btn:hover .material-symbols-outlined { color:#fff; }

  /* ── BOTTOM UI: Game-style nav bar ── */
  .bottom-ui {
    position:fixed; bottom:0; left:0; right:0;
    padding:0 clamp(12px,5vw,28px) 12px; z-index:50;
    display:flex; flex-direction:column; gap:10px;
  }

  /* Next Goal bar */
  .goal-bar {
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(15,20,55,0.82); border:1px solid rgba(255,255,255,0.12);
    border-radius:18px; padding:10px 16px; gap:12px;
    animation:fadeInUp 0.5s ease-out 0.2s both;
    backdrop-filter:blur(6px);
  }
  .goal-left { display:flex; align-items:center; gap:12px; }
  .goal-star-icon { font-size:28px; line-height:1; filter:drop-shadow(0 0 8px rgba(255,215,0,0.7)); }
  .goal-text-wrap { display:flex; flex-direction:column; }
  .goal-label { font-size:9px; font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.4); text-transform:uppercase; }
  .goal-text { font-size:15px; font-weight:700; color:#4FC3F7; letter-spacing:0.5px; }
  .goal-stars-row { display:flex; gap:5px; }
  .goal-dot {
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(135deg,#FFB300,#FF8C00);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; box-shadow:0 0 10px rgba(255,180,0,0.5);
    animation:dotPulse 2s ease-in-out infinite;
  }
  .goal-dot:nth-child(2){animation-delay:0.3s}.goal-dot:nth-child(3){animation-delay:0.6s}
  @keyframes dotPulse{0%,100%{box-shadow:0 0 8px rgba(255,180,0,0.4)}50%{box-shadow:0 0 18px rgba(255,180,0,0.8)}}

  /* Nav bar */
  .nav-bar {
    display:flex; align-items:center; justify-content:space-around;
    background:rgba(15,20,55,0.85); border:1px solid rgba(255,255,255,0.12);
    border-radius:20px; padding:10px 8px;
    animation:fadeInUp 0.6s ease-out 0.35s both;
    backdrop-filter:blur(8px);
  }

  .nav-btn {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; padding:6px 12px; cursor:pointer; position:relative;
    border:none; background:transparent; border-right:1px solid rgba(255,255,255,0.1);
    transition:transform 0.15s;
    flex:1;
  }
  .nav-btn:last-child { border-right:none; }
  .nav-btn:hover { transform:scale(1.08); }
  .nav-btn.active { background:rgba(100,80,200,0.55); border-radius:14px; border-right:none; box-shadow:0 2px 12px rgba(100,80,200,0.35); }

  .nav-icon { font-size:26px; line-height:1; position:relative; display:flex; align-items:center; justify-content:center; }
  .nav-label {
    font-size:10px; font-weight:700; letter-spacing:0.5px;
    color:rgba(255,255,255,0.55); text-transform:capitalize;
    white-space:nowrap;
  }
  .nav-btn.active .nav-label { color:#b39dff; }

  .notif-badge {
    position:absolute; top:-4px; right:-4px;
    width:17px; height:17px; border-radius:50%;
    background:#e53935; border:1.5px solid rgba(15,20,55,0.9);
    font-size:9px; font-weight:700; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }

  .sleep-zz {
    position:absolute; top:-10px; right:-8px;
    font-size:13px; color:#4FC3F7; font-weight:900;
    font-style:italic; letter-spacing:-1px;
    animation:zzFloat 1.8s ease-in-out infinite;
  }
  @keyframes zzFloat{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-5px);opacity:0.6}}

  @keyframes fadeInUp { from{transform:translateY(18px);opacity:0} to{transform:translateY(0);opacity:1} }

</style>
</head>
<body>

<canvas id="sky"></canvas>
<div id="sky-overlay"></div>
<div class="grid-floor" style="display:none"></div>
<div class="floor-glow" style="display:none"></div>
<div class="particles" id="dom-particles"></div>

<div class="pokeball-watermark" style="display:none">
  <img src="https://i.ibb.co/99Q0SB1W/Pokeball-PNG-Free-Download.png" alt="Pokeball">
</div>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="top-ui">
  <div>
    <div class="player-label">Trainer</div>
    <div class="player-name" id="trainerName">TRAINER</div>
    <div class="player-title">Pokémon Champion</div>
    <div class="rank-stars" id="rankStars">
      <span class="star">★</span><span class="star">★</span>
      <span class="star">★</span><span class="star">★</span>
      <span class="star">★</span>
    </div>
  </div>
  <div class="dex-id">
    <div class="dex-label">Trainer ID</div>
    <div class="dex-num" id="trainerId">#—</div>
  </div>
</div>

<div class="screen">
  <div class="party-layout">
    <div class="slots-col left" id="party-left"></div>

    <div class="trainer-wrap">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="trainer-glow"></div>
      <video class="trainer-img" id="trainerVideo"
        src="https://www.image2url.com/r2/default/videos/1778749524747-a0548b64-5e5d-4c36-8fb7-b8c077423ca3.webm"
        autoplay loop muted playsinline draggable="false">
      </video>
    </div>

    <div class="slots-col right" id="party-right"></div>
  </div>
</div>

<!-- BOTTOM UI: Nav bar -->
<div class="bottom-ui">
  <!-- Nav bar: Missions | Banners | Rift | Main Menu | Characters -->
  <div class="nav-bar">
    <button class="nav-btn" onclick="setActive(this)">
      <div class="nav-icon">
        <span class="material-symbols-outlined">assignment</span>
      </div>
      <div class="nav-label">Missions</div>
    </button>
    <button class="nav-btn" onclick="setActive(this);window.parent.postMessage({nav:'gacha-wish'},'*')">
      <div class="nav-icon">
        <span class="material-symbols-outlined">auto_awesome</span>
      </div>
      <div class="nav-label">Banners</div>
    </button>
    <button class="nav-btn" onclick="setActive(this);window.parent.postMessage({nav:'abyss'},'*')">
      <div class="nav-icon">
        <span class="material-symbols-outlined">apps</span>
      </div>
      <div class="nav-label">Rift</div>
    </button>
    <button class="nav-btn active" id="navMainMenu" onclick="setActive(this);window.parent.postMessage({nav:'world'},'*')">
      <div class="nav-icon">
        <span class="material-symbols-outlined">home</span>
      </div>
      <div class="nav-label">Main Menu</div>
    </button>
    <button class="nav-btn" id="navCharacters" onclick="setActive(this);window.parent.postMessage({nav:'characters'},'*')">
      <div class="nav-icon">
        <span class="material-symbols-outlined">person</span>
        <span class="sleep-zz" style="font-style:normal;font-size:11px;top:-8px;right:-10px;letter-spacing:0;">✦</span>
      </div>
      <div class="nav-label">Characters</div>
    </button>
  </div>
</div>

<script>
function setActive(btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// Build a Pokémon sprite URL with showdown fallback
function monSprite(mon) {
  const slug = (mon.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  const base = mon.isShiny
    ? `https://play.pokemonshowdown.com/sprites/ani-shiny/${slug}.gif`
    : `https://play.pokemonshowdown.com/sprites/ani/${slug}.gif`;
  return base;
}

// Render up to 3 cards into a column element
function renderCol(colEl, mons) {
  colEl.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const mon = mons[i];
    if (!mon) {
      const empty = document.createElement('div');
      empty.className = 'poke-card';
      empty.style.cssText = 'border:1px dashed rgba(255,255,255,0.08);background:rgba(6,8,13,0.4);opacity:0.25;min-height:108px;';
      colEl.appendChild(empty);
      continue;
    }
    const typeClass = mon.type1 ? `type-${mon.type1.toLowerCase()}` : '';
    const displayName = mon.nickname || mon.name || '???';
    const sprite = monSprite(mon);
    const card = document.createElement('div');
    card.className = `poke-card ${typeClass}`;
    const img = document.createElement('img');
    img.alt = displayName;
    img.onerror = function() {
      const fallback = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${mon.id}.png`;
      if (this.src !== fallback) this.src = fallback;
    };
    img.src = sprite;
    const label = document.createElement('span');
    label.className = 'poke-name';
    label.textContent = displayName.toUpperCase();
    card.appendChild(img);
    card.appendChild(label);
    colEl.appendChild(card);
  }
}

(function() {
  try {
    const save = JSON.parse(localStorage.getItem('hexamon:save:v2') || '{}');
    const name = (save.player && save.player.name) || save.name || '';
    if (name) document.getElementById('trainerName').textContent = name.toUpperCase();

    // Trainer ID
    const tid = (save.player && save.player.id) || save.id || null;
    if (tid) document.getElementById('trainerId').textContent = '#' + String(tid).slice(0, 10);

    // Party — save stores multiple teams; activeTeamIdx selects the active one
    const teams = save.teams || [];
    const activeIdx = typeof save.activeTeamIdx === 'number' ? save.activeTeamIdx : 0;
    const team = (teams[activeIdx] || []).slice(0, 6);
    renderCol(document.getElementById('party-left'),  team.slice(0, 3));
    renderCol(document.getElementById('party-right'), team.slice(3, 6));

    const CHAR_STARS = {
      'Cynthia':5,'Lance':5,'Steven':5,'Leon':5,'N':5,
      'Misty':4,'Iris':4,'Elesa':4,'Brock':4
    };
    const activeChar = localStorage.getItem('crimsonsky:activeChar') || 'Cynthia';
    const stars = CHAR_STARS[activeChar] || 5;
    const starsEl = document.getElementById('rankStars');
    starsEl.innerHTML = Array(stars).fill('<span class="star">★</span>').join('');
  } catch(e) {}
})();

const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initStars();
}
window.addEventListener('resize', resize);

const STAR_COUNT = 320;
const starX = new Float32Array(STAR_COUNT);
const starY = new Float32Array(STAR_COUNT);
const starR = new Float32Array(STAR_COUNT);
const starA = new Float32Array(STAR_COUNT);
const starSpeed = new Float32Array(STAR_COUNT);
const starPhase = new Float32Array(STAR_COUNT);
const starBright = new Uint8Array(STAR_COUNT);

function initStars() {
  for (let i = 0; i < STAR_COUNT; i++) {
    starX[i] = Math.random() * W;
    starY[i] = Math.random() * H;
    starR[i] = Math.random() * 2.2 + 0.3;
    starA[i] = Math.random() * 0.5 + 0.5;
    starSpeed[i] = Math.random() * 2.5 + 0.6;
    starPhase[i] = Math.random() * Math.PI * 2;
    starBright[i] = Math.random() < 0.15 ? 1 : 0;
  }
}

function drawStars(t) {
  for (let i = 0; i < STAR_COUNT; i++) {
    const pulse = Math.sin(t * starSpeed[i] + starPhase[i]) * 0.48 + 0.52;
    const alpha = starA[i] * pulse;
    const r = starR[i];

    if (starBright[i]) {
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(starX[i], starY[i], r * 1.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = alpha * 0.35;
      ctx.strokeStyle = '#cfc8f0';
      ctx.lineWidth = 0.7;
      const fl = r * 5;
      ctx.beginPath();
      ctx.moveTo(starX[i] - fl, starY[i]); ctx.lineTo(starX[i] + fl, starY[i]);
      ctx.moveTo(starX[i], starY[i] - fl); ctx.lineTo(starX[i], starY[i] + fl);
      ctx.stroke();
      const grd = ctx.createRadialGradient(starX[i], starY[i], 0, starX[i], starY[i], r * 6);
      grd.addColorStop(0, `rgba(200,190,255,${alpha * 0.4})`);
      grd.addColorStop(1, 'rgba(200,190,255,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(starX[i], starY[i], r * 6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#cfc8f0';
      ctx.fillRect(starX[i] - r * 0.5, starY[i] - r * 0.5, r, r);
    }
  }
  ctx.globalAlpha = 1;
}


let lastFrame = 0;
const TARGET_MS = 1000 / 45;

function loop(t) {
  requestAnimationFrame(loop);
  const delta = t - lastFrame;
  if (delta < TARGET_MS) return;
  lastFrame = t - (delta % TARGET_MS);

  ctx.fillStyle = '#04020f';
  ctx.fillRect(0, 0, W, H);

  drawStars(t * 0.001);
}

resize();
requestAnimationFrame(loop);

const pColors = ['#FFD700','#4FC3F7','#ffffff','#FFA500','#7C4DFF'];
const container = document.getElementById('dom-particles');
for (let i = 0; i < 14; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const sz = Math.random() * 2.4 + 0.7;
  p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;
    bottom:${Math.random()*25}%;animation-duration:${Math.random()*7+4}s;
    animation-delay:${Math.random()*6}s;
    background:${pColors[Math.floor(Math.random()*pColors.length)]};`;
  container.appendChild(p);
}
</script>
