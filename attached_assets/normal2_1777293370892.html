<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Battle UI</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f0;
            --text-muted: #888890;
            --accent-green: #4ade80;
            --terminal-cyan: #22d3ee;
            --accent-orange: #fb923c;
            --accent-red: #f87171;
            --accent-purple: #a78bfa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 2px solid #c0392b;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .title {
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 800;
            color: var(--accent-red);
        }

        .turn-badge {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* Enemy side — top right */
        .enemy-side {
            position: absolute;
            top: 14px;
            left: 14px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .enemy-sprite-wrap {
            position: absolute;
            top: 10px;
            right: 14px;
        }

        .info-card {
            background: rgba(10, 10, 14, 0.82);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            padding: 8px 12px;
            backdrop-filter: blur(6px);
            min-width: 160px;
        }

        .info-card.enemy { text-align: left; }
        .info-card.player { text-align: left; }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }

            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .poke-level {
            font-size: 11px;
            color: var(--text-muted);
        }

        .type-badge {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .type-grass { background: #166534; color: #4ade80; }
        .type-flying { background: #1e3a5f; color: #60a5fa; }
        .type-normal { background: #2d2d2d; color: #d1d5db; }
        .type-water  { background: #1e3a5f; color: #38bdf8; }
        .type-fire   { background: #7c1d0e; color: #fb923c; }

        .hp-bar-wrap {
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .hp-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .hp-bar.full  { background: var(--accent-green); }
        .hp-bar.mid   { background: #facc15; }
        .hp-bar.low   { background: var(--accent-red); }

        .hp-text {
            font-size: 9px;
            color: var(--text-muted);
        }

        .atk-text {
            font-size: 9px;
            color: var(--text-muted);
        }

        .enemy-sprite {
            width: 110px;
            height: 110px;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.7));
        }

        /* Player side — bottom left */
        .player-side {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .player-sprite {
            width: 95px;
            height: 95px;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8));
        }

        /* Player card — bottom right */
        .player-card-wrap {
            position: absolute;
            bottom: 12px;
            right: 12px;
        }

        /* Log Box */
        .log-box {
            background: #050508;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 14px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: var(--accent-orange);
            line-height: 1.7;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            min-height: 72px;
        }

        .log-box .log-dot { color: var(--accent-orange); margin-right: 6px; }

        /* Move Section */
        .move-header {
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            padding-left: 2px;
        }

        .move-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .move-btn {
            background: linear-gradient(180deg, #1a1a22 0%, #111118 100%);
            border: 1px solid var(--accent-purple);
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.18s ease;
            color: var(--text-main);
        }

        .move-btn:hover {
            background: linear-gradient(180deg, #26263a 0%, #1a1a28 100%);
            border-color: #c4b5fd;
            transform: translateY(-2px);
        }

        .move-btn:active { transform: translateY(1px); }

        .move-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .move-meta {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        /* Bottom Actions */
        .action-row {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(180deg, #1c1c21 0%, #121216 100%);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-main);
            padding: 16px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: linear-gradient(180deg, #2a2a32 0%, #1a1a20 100%);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .action-btn:active { transform: translateY(1px); }

        .pokeball-count {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0;
        }

    </style>
</head>
<body>

<div class="app-container">

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <button class="close-btn">◀ BACK</button>
            <div class="title">WILD BATTLE</div>
        </div>
        <div class="turn-badge"</div>
    </header>

    <!-- Battle Arena -->
    <div class="battle-arena">

        <!-- Enemy top-left info card -->
        <div class="enemy-side">
            <div class="info-card enemy">
                <div class="card-top">
                    <span class="poke-name">Sprigatito</span>
                    <span class="poke-level">Lv87</span>
                </div>
                <div><span class="type-badge type-grass">Grass</span></div>
                <div class="hp-bar-wrap"><div class="hp-bar full" style="width:100%"></div></div>
                <div class="hp-text">236/236</div>
            </div>
        </div>

        <!-- Enemy sprite top-right -->
        <div class="enemy-sprite-wrap">
            <img class="enemy-sprite"
                 src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/906.png"
                 alt="Sprigatito">
        </div>

        <!-- Player sprite bottom-left -->
        <div class="player-side">
            <img class="player-sprite"
                 src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/17.png"
                 alt="Pidgeotto">
        </div>

        <!-- Player card bottom-right -->
        <div class="player-card-wrap">
            <div class="info-card player">
                <div class="card-top">
                    <span class="poke-name">Pidgeotto</span>
                    <span class="poke-level">Lv5</span>
                </div>
                <div class="hp-bar-wrap"><div class="hp-bar full" style="width:100%"></div></div>
                <div style="display:flex;justify-content:space-between;">
                    <span class="hp-text">27/27</span>
                    <span class="atk-text">ATK: 11</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Log -->
    <div class="log-box">
        <span class="log-dot">·</span> A wild Sprigatito (Lv87) appeared in Paldea!
    </div>

    <!-- Moves -->
    <div class="move-header">Choose a Move</div>
    <div class="move-grid">
        <button class="move-btn">
            <div class="move-name">Hurricane</div>
            <div class="move-meta">PWR: 110 · ACC: 70% · Flying</div>
        </button>
        <button class="move-btn">
            <div class="move-name">Aerial Ace</div>
            <div class="move-meta">PWR: 60 · ACC: 100% · Flying</div>
        </button>
        <button class="move-btn">
            <div class="move-name">Tailwind</div>
            <div class="move-meta">PWR: 50 · ACC: 100% · Normal</div>
        </button>
        <button class="move-btn">
            <div class="move-name">Razor Wind</div>
            <div class="move-meta">PWR: 50 · ACC: 100% · Normal</div>
        </button>
    </div>

    <!-- Actions -->
    <div class="action-row">
        <button class="action-btn">Switch</button>
        <button class="action-btn">Run</button>
        <button class="action-btn">Pokéballs <span class="pokeball-count">(5)</span></button>
    </div>

</div>
</body>
</html>
