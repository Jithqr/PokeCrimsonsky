<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Hunt UI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f0;
            --text-muted: #888890;
            --accent-green: #4ade80;
            --terminal-cyan: #22d3ee;
            --accent-orange: #fb923c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--panel-border);
        }

        .back-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .title {
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .spacer { width: 50px; }

        /* Region Banner */
        .region-banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .region-name {
            display: flex;
            align-items: center;
            gap-8px;
            font-size: 15px;
            font-weight: 700;
            gap: 8px;
        }

        .region-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-orange);
            display: inline-block;
        }

        .hunt-progress {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.75);
            overflow: hidden;
        }

        .pokemon-sprite {
            width: 160px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.8));
            z-index: 2;
            image-rendering: pixelated;
        }

        /* Encounter Banner */
        .encounter-banner {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 14px 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .encounter-banner .wild { color: var(--accent-orange); }

        .level-badge {
            background: #1e1e26;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-muted);
            margin: 0 4px;
            border: 1px solid #333;
        }

        /* Party Section */
        .party-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .party-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .party-header .tap-hint {
            color: var(--accent-orange);
            font-size: 10px;
        }

        .party-grid {
            display: flex;
            gap: 10px;
        }

        .party-card {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .party-card:hover {
            border-color: rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
        }

        .party-card.lead {
            border-color: var(--accent-orange);
            background: rgba(251, 146, 60, 0.07);
        }

        .party-sprite {
            width: 44px;
            height: 44px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .party-name {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            line-height: 1.2;
        }

        .party-level {
            font-size: 9px;
            color: var(--text-muted);
        }

        .lead-badge {
            font-size: 8px;
            color: var(--accent-orange);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Log Box */
        .log-box {
            background: #050508;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: var(--terminal-cyan);
            line-height: 1.6;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            min-height: 100px;
        }

        /* Action Buttons */
        .button-row {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: linear-gradient(180deg, #1c1c21 0%, #121216 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 18px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            flex: 1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: linear-gradient(180deg, #2a2a32 0%, #1a1a20 100%);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .action-btn:active { transform: translateY(1px); }

        .action-btn .btn-icon {
            font-size: 20px;
        }

        .btn-icon svg {
            width: 22px;
            height: 22px;
            stroke-width: 2px;
        }

        .hunt-btn .btn-icon svg { stroke: var(--accent-green); }
        .battle-btn .btn-icon svg { stroke: var(--accent-orange); }

        .action-btn.hunt-btn {
            border-color: rgba(74, 222, 128, 0.25);
        }

        .action-btn.hunt-btn:hover {
            border-color: rgba(74, 222, 128, 0.45);
        }

        .action-btn.hunt-btn .btn-label { color: var(--accent-green); }

        .action-btn.battle-btn {
            border-color: rgba(251, 146, 60, 0.25);
        }

        .action-btn.battle-btn:hover {
            border-color: rgba(251, 146, 60, 0.45);
        }

        .action-btn.battle-btn .btn-label { color: var(--accent-orange); }

    </style>
</head>
