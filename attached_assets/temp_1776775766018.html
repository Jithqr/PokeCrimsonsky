<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Trainer Card</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0114;
            --card-bg: #150a1d;
            --border-purple: #4a1d52;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --stat-bg: #22132e;
            --pixel-font: 'VT323', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--pixel-font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            letter-spacing: 1px;
        }

        .trainer-card {
            background-color: var(--card-bg);
            width: 600px;
            border: 4px solid var(--border-purple);
            border-radius: 12px;
            padding: 25px;
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        .avatar-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-container img {
            width: 150px;
            height: auto;
            image-rendering: pixelated;
            display: block;
            /* CSS Animation fallback to ensure movement */
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .id-badge {
            font-size: 1.2rem;
            color: var(--text-dim);
            text-align: right;
            margin-bottom: 5px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--border-purple);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .title { font-size: 2.2rem; text-transform: uppercase; margin: 0; }
        .rank { font-size: 1.8rem; }
        .location { font-size: 1.4rem; color: var(--text-dim); margin-bottom: 15px; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: var(--stat-bg);
            padding: 8px 12px;
            border: 2px solid rgba(255,255,255,0.05);
        }

        .stat-label { font-size: 1rem; color: var(--text-dim); text-transform: uppercase; display: block; }
        .stat-value { font-size: 1.5rem; }

        .exp-bar {
            height: 12px;
            background: #111;
            border: 2px solid var(--border-purple);
            margin-top: 5px;
        }

        .exp-fill {
            width: 100%; 
            height: 100%;
            background: linear-gradient(90deg, #6a1b9a, #9c27b0);
        }

        .footer {
            grid-column: 1 / span 2;
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px solid var(--border-purple);
            font-size: 1.2rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="trainer-card">
        <div class="avatar-container">
            <img src="https://ibb.co/PKzh2kM.png" alt="Trainer Animation">
        </div>

        <div class="main-info">
            <div class="id-badge">IDNo. 1485555700</div>
            <div class="header">
                <h1 class="title">TRAINER CARD</h1>
                <div class="rank">Rank 10</div>
            </div>
            
            <div class="location">Nuvema Town • TRAINER</div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Exp. Points</span>
                    <span class="stat-value">1,000,000</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">To Next Rank</span>
                    <span class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Wins</span>
                    <span class="stat-value" style="color: #4caf50;">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Losses</span>
                    <span class="stat-value" style="color: #ff5252;">0</span>
                </div>
            </div>

            <div style="margin-top: 15px;">
                <span class="stat-label">Exp Progress (0 / 0)</span>
                <div class="exp-bar"><div class="exp-fill"></div></div>
            </div>
        </div>

        <div class="footer">
            <div>Adventure started: Jan 21, 2022</div>
        </div>
    </div>

</body>
</html>
