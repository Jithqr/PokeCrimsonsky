<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Stats - Venusaur</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #1a1a1f;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent-green: #78C850;
            --accent-poison: #A040A0;
            --bar-hp: #ff3b30;
            --bar-atk: #ff9500;
            --bar-def: #ffcc00;
            --bar-spatk: #34c759;
            --bar-spatk-custom: #007aff;
            --bar-spdef: #34c759;
            --bar-speed: #ff2d55;
            --ev-color: #ff3b30;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Mobile layout max-width */
            background-color: var(--bg-color);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 16px;
            background-color: #121217;
            border-bottom: 1px solid #2c2c35;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #3a3a44;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .header-title {
            flex-grow: 1;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            margin-right: 40px; /* Balance the back button */
        }

        /* Hero Section */
        .hero {
            padding: 20px 16px;
        }

        .pokemon-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .pokemon-name {
            font-size: 28px;
            font-weight: 700;
        }

        .type-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .type-grass { background-color: var(--accent-green); }
        .type-poison { background-color: var(--accent-poison); }

        .image-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .image-container img {
            max-width: 180px;
            height: auto;
            image-rendering: pixelated; /* Keeps the sprite looking crisp */
        }

        /* Base Stats Section */
        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin: 0 16px 16px 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2c2c35;
        }

        .stats-container {
            padding: 0 16px;
            margin-bottom: 30px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .stat-name {
            width: 60px;
            color: var(--text-muted);
        }

        .stat-value {
            width: 35px;
            font-weight: 600;
            text-align: right;
            margin-right: 12px;
        }

        .stat-bar-bg {
            flex-grow: 1;
            height: 6px;
            background-color: #2c2c35;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
        }

        .stat-percentage {
            width: 40px;
            text-align: right;
            color: var(--text-muted);
            font-size: 12px;
        }

        .stat-total {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #2c2c35;
            font-weight: 700;
            font-size: 16px;
        }
        
        .total-value {
            color: var(--bar-hp);
        }

        /* EV Section */
        .ev-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .ev-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 12px;
        }

        .ev-card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .ev-card-title { font-weight: 600; }
        .ev-card-base { color: var(--text-muted); }

        .ev-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .ev-label {
            font-size: 12px;
            color: var(--text-muted);
            width: 20px;
        }

        .ev-input {
            background-color: transparent;
            border: 1px solid #3a3a44;
            color: white;
            border-radius: 4px;
            width: 40px;
            padding: 4px;
            text-align: center;
            font-size: 12px;
        }

        /* Custom Range Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-top: 4px;
            margin-bottom: 4px;
        }
        input[type=range]:focus { outline: none; }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #2c2c35;
            border-radius: 2px;
        }
        
        input[type=range]::-webkit-slider-thumb {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -4px;
            background: var(--ev-color);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            padding: 0 16px;
            margin-top: 20px;
        }

        .btn-action {
            flex: 1;
            background-color: #2c2c3a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #3a3a4a;
        }
        
        .btn-reset-large {
            display: block;
            width: calc(100% - 32px);
            margin: 16px auto 0;
            background-color: #2c2c3a;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 24px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="btn-back">← Back</button>
        <div class="header-title">Paid Zone · Venusaur</div>
    </div>

    <div class="hero">
        <div class="pokemon-header">
            <h1 class="pokemon-name">Venusaur</h1>
            <span class="type-badge type-grass">Grass</span>
            <span class="type-badge type-poison">Poison</span>
        </div>
        <div class="image-container">
            <img src="https://projectpokemon.org/images/normal-sprite/venusaur.gif" alt="Venusaur">
        </div>
    </div>

    <h2 class="section-title">Current Stats</h2>
    <div class="stats-container">
        <div class="stat-row">
            <div class="stat-name">HP</div>
            <div class="stat-value">80</div>
            <div class="stat-bar-bg">
                <div class="stat-bar-fill" style="width: 31%; background-color: var(--bar-hp);"></div>
            </div>
            <div class="stat-percentage">31%</div>
        </div>
        <div class="stat-row">
            <div class="stat-name">Attack</div>
            <div class="stat-value">82</div>
            <div class="stat-bar-bg">
                <div class="stat-bar-fill" style="width: 32%; background-color: var(--bar-atk);"></div>
            </div>
            <div class="stat-percentage">32%</div>
        </div>
        <div class="stat-row">
            <div class="stat-name">Defense</div>
            <div class="stat-value">83</div>
            <div class="stat-bar-bg">
                <div class="stat-bar-fill" style="width: 33%; background-color: var(--bar-def);"></div>
            </div>
            <div class="stat-percentage">33%</div>
        </div>
        <div class="stat-row">
            <div class="stat-name">Sp. Atk</div>
            <div class="stat-value">100</div>
            <div class="stat-bar-bg">
                <div class="stat-bar-fill" style="width: 39%; background-color: var(--bar-spatk-custom);"></div>
            </div>
            <div class="stat-percentage">39%</div>
        </div>
        <div class="stat-row">
            <div class="stat-name">Sp. Def</div>
            <div class="stat-value">100</div>
            <div class="stat-bar-bg">
                <div class="stat-bar-fill" style="width: 39%; background-color: var(--bar-spdef);"></div>
            </div>
            <div class="stat-percentage">39%</div>
        </div>
        <div class="stat-row">
            <div class="stat-name">Speed</div>
            <div class="stat-value">80</div>
            <div class="stat-bar-bg">
                <div class="stat-bar-fill" style="width: 31%; background-color: var(--bar-speed);"></div>
            </div>
            <div class="stat-percentage">31%</div>
        </div>
        
        <div class="stat-total">
            <span>Total</span>
            <span class="total-value">525</span>
        </div>
    </div>

    <h2 class="section-title" style="display: flex; align-items: center; gap: 8px;">
        <span style="color: #ff3b30; font-size: 16px;">◎</span> Ev Enhancer
    </h2>

    <div class="ev-grid">
        
        <div class="ev-card">
            <div class="ev-card-header">
                <span class="ev-card-title">HP</span>
                <span class="ev-card-base">(45)</span>
            </div>
            <div class="ev-row">
                <span class="ev-label">EV</span>
                <input type="text" class="ev-input" value="248">
            </div>
            <input type="range" class="slider-ev" min="0" max="252" value="248">
        </div>

        <div class="ev-card">
            <div class="ev-card-header">
                <span class="ev-card-title">Sp. Atk</span>
                <span class="ev-card-base">(65)</span>
            </div>
            <div class="ev-row">
                <span class="ev-label">EV</span>
                <input type="text" class="ev-input" value="0">
            </div>
            <input type="range" class="slider-ev" min="0" max="252" value="0">
        </div>

        <div class="ev-card">
            <div class="ev-card-header">
                <span class="ev-card-title">Attack</span>
                <span class="ev-card-base">(49)</span>
            </div>
            <div class="ev-row">
                <span class="ev-label">EV</span>
                <input type="text" class="ev-input" value="148">
            </div>
            <input type="range" class="slider-ev" min="0" max="252" value="148">
        </div>

        <div class="ev-card">
            <div class="ev-card-header">
                <span class="ev-card-title">Sp. Def</span>
                <span class="ev-card-base">(65)</span>
            </div>
            <div class="ev-row">
                <span class="ev-label">EV</span>
                <input type="text" class="ev-input" value="0">
            </div>
            <input type="range" class="slider-ev" min="0" max="252" value="0">
        </div>

        <div class="ev-card">
            <div class="ev-card-header">
                <span class="ev-card-title">Defense</span>
                <span class="ev-card-base">(49)</span>
            </div>
            <div class="ev-row">
                <span class="ev-label">EV</span>
                <input type="text" class="ev-input" value="104">
            </div>
            <input type="range" class="slider-ev" min="0" max="252" value="104">
        </div>

        <div class="ev-card">
            <div class="ev-card-header">
                <span class="ev-card-title">Speed</span>
                <span class="ev-card-base">(45)</span>
            </div>
            <div class="ev-row">
                <span class="ev-label">EV</span>
                <input type="text" class="ev-input" value="0">
            </div>
            <input type="range" class="slider-ev" min="0" max="252" value="0">
        </div>

    </div>

    <div class="action-buttons">
        <button class="btn-action">Reset EVs</button>
        <button class="btn-action">lvl + 10</button>
        <button class="btn-action">lvl + 1</button>
    </div>
    
    <button class="btn-reset-large">PAY 510 💷 </button>

</div>

</body>
</html>
