<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Zone UI</title>
    <style>
        /* Modern CSS Variables */
        :root {
            --bg-dark: #0a0a0c;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f0;
            --text-muted: #888890;
            --accent-green: #4ade80;
            --terminal-cyan: #22d3ee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main App Container */
        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Top Navigation */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--panel-border);
        }

        .back-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .title {
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .spacer { width: 50px; }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 4px;
        }

        .stat-value.highlight { color: #facc15; }

        /* Sprite Showcase with Pixel Art Background */
        .sprite-showcase {
            height: 250px;
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            
            /* ADD YOUR IMAGE FILENAME HERE */
            background-image: url('https://www.freepik.com/free-ai-image/pixel-art-river-landscape-illustration_299867715.htm#fromView=keyword&page=1&position=17&uuid=289bc809-23b0-4b04-bd2b-5c2bdd1e1b78&query=Pixel+art+sunrise');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            
            /* Inner shadow darkens the edges so it blends smoothly into your dark UI */
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .pokemon-sprite {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0px 15px 15px rgba(0, 0, 0, 0.6));
            animation: float 3s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* Encounter Banner */
        .encounter-banner {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .level-badge {
            background: #222;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-muted);
            margin: 0 4px;
            border: 1px solid #333;
        }

        /* Terminal Log Box */
        .log-box {
            background: #050508;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: var(--terminal-cyan);
            line-height: 1.6;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            min-height: 120px; 
        }

        /* Button Stack Container */
        .action-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button-row {
            display: flex;
            gap: 12px;
        }

        /* Shared Button Styles */
        .action-btn {
            background: linear-gradient(180deg, #1c1c21 0%, #121216 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        .action-btn:hover {
            background: linear-gradient(180deg, #2a2a32 0%, #1a1a20 100%);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        
        .action-btn:active {
            transform: translateY(1px);
        }

        .btn-full { width: 100%; }
        .btn-half { flex: 1; }

    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <button class="back-btn">◀</button>
        <div class="title">safari zone</div>
        <div class="spacer"></div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            Balls
            <div class="stat-value">⚪ 29/30</div>
        </div>
        <div class="stat-item">
            Caught
            <div class="stat-value" style="color: var(--accent-green);">0</div>
        </div>
        <div class="stat-item">
            Kalos
            <div class="stat-value highlight">#20</div>
        </div>
    </div>

    <div class="sprite-showcase">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/704.png" alt="Goomy" class="pokemon-sprite">
    </div>

    <div class="encounter-banner">
        A wild Goomy <span class="level-badge">Lv. 37</span> appeared!
    </div>

    <div class="log-box"></div>

    <div class="action-stack">
        <button class="action-btn btn-full">Hunt</button>
        <div class="button-row">
            <button class="action-btn btn-half">Use Safari Ball</button>
            <button class="action-btn btn-half">Escape</button>
        </div>
    </div>
</div>

</body>
</html>
