<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crimson Sky Marketplace</title>
    <style>
        :root {
            --bg-color: #0d0d0f;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent-pink: #ff3377;
            --accent-gold: #ffcc00;
            --accent-blue: #0a84ff;
            --border-color: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 80px; 
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 10px;
        }

        h1 {
            color: var(--accent-pink);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance {
            color: var(--accent-gold);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .main-nav {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .main-nav button {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .main-nav button.active {
            background-color: #2c2c2e;
            color: var(--text-main);
        }

        .sub-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
            scrollbar-width: none; 
        }
        
        .sub-nav::-webkit-scrollbar {
            display: none; 
        }

        .sub-nav button {
            white-space: nowrap;
            padding: 8px 16px;
            background-color: var(--card-bg);
            border: 1px solid transparent;
            color: var(--text-muted);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .sub-nav button.active {
            border-color: #c856ff;
            color: #c856ff;
        }

        .store-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .item-details {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .item-action {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-price {
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 1rem;
        }

        .buy-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .buy-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
